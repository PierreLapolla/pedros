[project]
name = "pedros"
version = "0.13.0"
description = "Small utility package for my projects."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Pierre LAPOLLA"}
]
requires-python = ">=3.10,<3.16"
keywords = ["utilities", "logging", "decorators", "progress-bar", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "wrapt>=2.1.1",
]

[project.urls]
Homepage = "https://pypi.org/project/pedros/"
Repository = "https://github.com/pierrelapolla/pedros"
Issues = "https://github.com/pierrelapolla/pedros/issues"
Documentation = "https://pierrelapolla.github.io/pedros/"

[project.optional-dependencies]
rich = [
    "rich>=14.3.3",
]
all = [
    "rich>=14.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=3.7.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-benchmark>=5.2.3",
    "hypothesis>=6.151.9",
    "rich>=14.3.3",
    "tqdm>=4.67.3",
]
docs = [
    "zensical>=0.0.51",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=. --cov-report=html"
testpaths = ["tests"]
pythonpath = ["src"]
