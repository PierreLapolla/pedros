name: CI & Publish

on:
  pull_request:
    branches: [ master ]

  push:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require version bump when publishable sources change
        if: github.event_name == 'pull_request'
        run: |
          git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- src/ pyproject.toml && exit 0
          base=$(git show "origin/${{ github.base_ref }}:pyproject.toml" | grep -m1 '^version = ')
          head=$(grep -m1 '^version = ' pyproject.toml)
          [ "$base" != "$head" ] || { echo "::error::src/ or pyproject.toml changed but version wasn't bumped"; exit 1; }

  test:
    needs: [ version-check ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            experimental: false
          - python-version: "3.11"
            experimental: false
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: false
          - python-version: "3.15"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  build:
    needs: [ version-check ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Build distributions
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [ version-check, test, build ]
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    environment:
      name: pypi
      url: https://pypi.org/project/pedros/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple
