[project]
site_url = "https://pierrelapolla.github.io/pedros/"
site_name = "pedros"
site_description = "Small utility package for my projects."
site_author = "Pierre LAPOLLA"

copyright = "Copyright &copy; 2026 Pierre LAPOLLA"

repo_url = "https://github.com/pierrelapolla/pedros"
repo_name = "pierrelapolla/pedros"
# edit_uri = "edit/master/docs/"

nav = [
  { "Get Started" = "index.md" },
  { "Guide" = [
      { "Logging" = "guide/logging.md" },
      { "Progress Bars" = "guide/progress-bars.md" },
      { "Decorators" = [
          { "Overview" = "guide/decorators/index.md" },
          { "timed" = "guide/decorators/timed.md" },
          { "safe" = "guide/decorators/safe.md" },
          { "trace" = "guide/decorators/trace.md" },
          { "monitor" = "guide/decorators/monitor.md" },
        ] },
      { "Dependency Checks" = "guide/has-dep.md" },
    ] },
  { "API Reference" = "reference.md" },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  # "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pierrelapolla/pedros"

# Self-host Google Fonts. Without the include filter, the plugin also
# downloads ~8 MB of unused third-party scripts referenced in the theme bundle.
[project.plugins.privacy]
assets_include = ["fonts.googleapis.com/*", "fonts.gstatic.com/*"]

# API reference rendered from docstrings (Sphinx/reST style).
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
heading_level = 3
show_root_heading = true
show_root_full_path = false
show_source = false
show_signature_annotations = true
separate_signature = true

# Generates /llms.txt (and /llms-full.txt) from the pages below.
[project.plugins.llmstxt]
markdown_description = """
A small package of reusable Python utilities: zero-setup logging, a
multi-backend progress bar, and sync/async-safe decorators for timing,
error handling, and call tracing.

Python >=3.10,<3.16. Install with `pip install pedros` or `uv add pedros`.
`rich` and `tqdm` are optional, auto-detected at runtime for enhanced
logging/progress-bar backends.
"""
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
Docs = [
  { "index.md" = "Installation, quick tour" },
  { "guide/logging.md" = "`setup_logging`, `get_logger`, pedros's own zero-setup logger" },
  { "guide/progress-bars.md" = "`progbar`, backend selection (rich/tqdm/auto/none)" },
  { "guide/decorators/index.md" = "`@timed`, `@safe`, `@trace`, and `@monitor`" },
  { "guide/decorators/timed.md" = "Log function execution time" },
  { "guide/decorators/safe.md" = "Catch/log/re-raise exceptions, callbacks" },
  { "guide/decorators/trace.md" = "Log a function's args/return value/raised exception, never suppresses" },
  { "guide/decorators/monitor.md" = "Combines timed/safe/trace with their defaults, no config" },
  { "guide/has-dep.md" = "`has_dep`, optional-dependency detection" },
  { "reference.md" = "Every public signature in one place" },
]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
